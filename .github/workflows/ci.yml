name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  web:
    name: Web (typecheck + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image (build + smoke test)
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t clientbrief-ai .
      - name: Smoke test
        run: |
          docker run -d --name app -p 8000:8000 -e PUBLIC_DAILY_RUNS=0 clientbrief-ai
          for i in $(seq 1 30); do curl -fs localhost:8000/api/health && break; sleep 1; done
          curl -fs localhost:8000/api/demos | python3 -c "import json,sys; assert len(json.load(sys.stdin)) >= 3"
          curl -fs localhost:8000/ | grep -q "ClientBrief AI"
          docker logs app

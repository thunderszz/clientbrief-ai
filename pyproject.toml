[project]
name = "clientbrief-ai"
version = "2.0.0"
description = "Multi-agent pre-meeting intelligence: LangGraph pipeline, FastAPI streaming API, React UI."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["web", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
